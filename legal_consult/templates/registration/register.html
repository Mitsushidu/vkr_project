{% extends "base.html" %}

{% block title %}Регистрация{% endblock %}

{% block content %}
<section class="auth-card narrow-card">
    <h1>Регистрация</h1>
    <p class="muted">Создайте учётную запись обычного пользователя для доступа к разделу консультаций.</p>
    <form method="post" class="stack-form">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="button primary" type="submit">Зарегистрироваться</button>
    </form>
    <p class="muted">Уже есть аккаунт? <a href="{% url 'login' %}">Войти</a></p>
</section>
{% endblock %}
