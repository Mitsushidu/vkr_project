{% extends "base.html" %}

{% block title %}Вход в систему{% endblock %}

{% block content %}
<section class="auth-card narrow-card">
    <h1>Вход в систему</h1>
    <p class="muted">Авторизуйтесь для работы с разделом юридического консультирования.</p>
    <form method="post" class="stack-form">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="button primary" type="submit">Войти</button>
    </form>
    <p class="muted">Нет аккаунта? <a href="{% url 'register' %}">Зарегистрироваться</a></p>
</section>
{% endblock %}
